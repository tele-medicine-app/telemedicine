<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Telehealth Workspace</title>
<style>
:root {
  --bg-app: #f1f5f9;       
  --panel: #ffffff;        
  --text: #1e293b;         
  --muted: #64748b;        
  --border: #e2e8f0;       
  
  --meet-green-primary: #34A853;
  --meet-green-dark: #137333;
  --meet-green-light: #e6f4ea;
  --red: #ea4335;

  --shadow-island: 0 12px 32px -4px rgba(0,0,0,0.06), 0 4px 12px -2px rgba(0,0,0,0.04);
  --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg-app); font-family: 'Google Sans', Roboto, Arial, sans-serif;
  color: var(--text); display: flex; flex-direction: column; padding: 16px; gap: 16px;
}

/* Header Island */
.header {
  height: 68px; flex: 0 0 68px; background: var(--panel); border-radius: 24px;
  box-shadow: var(--shadow-sm); border: 1px solid var(--border); display: flex;
  align-items: center; justify-content: space-between; padding: 0 24px; z-index: 10;
}
.brand { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 42px; height: 42px; border-radius: 14px;
  background: linear-gradient(135deg, var(--meet-green-primary), #0F9D58);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 22px; box-shadow: 0 4px 12px rgba(52,168,83,.25);
}
.brand h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.3px; color: var(--text); }
.connection {
  display: flex; align-items: center; gap: 10px; padding: 8px 18px;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--bg-app); font-size: 13px; font-weight: 600; color: var(--muted);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px rgba(234, 67, 53, 0.2); }
body.joined .dot { background: var(--meet-green-primary); box-shadow: 0 0 0 2px rgba(52, 168, 83, 0.2); }

/* Master Workspace Columns */
.main {
  flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; 
  overflow: hidden; position: relative;
  transition: grid-template-columns .3s cubic-bezier(0.4, 0, 0.2, 1), gap .3s ease;
}
body.chat-collapsed .main { grid-template-columns: minmax(0, 1fr) 0px; gap: 0px; }

.workspace { display: flex; flex-direction: column; height: 100%; gap: 16px; position: relative; }
.video-stage { flex: 1; position: relative; width: 100%; height: 100%; }

.tile {
  position: absolute; overflow: hidden; border-radius: 24px; background: var(--panel);
  border: 1px solid var(--border); box-shadow: var(--shadow-island);
  display: flex; flex-direction: column; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
video { width: 100%; height: 100%; object-fit: cover; background: #111; }
.tile.maximized { top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; z-index: 1; cursor: default; }
.tile.minimized {
  top: auto; left: auto; bottom: 16px; right: 16px; width: 280px; height: 158px;
  z-index: 10; cursor: pointer; box-shadow: 0 12px 36px rgba(0,0,0,0.15); border: 2px solid var(--border);
}
.tile.minimized:hover { transform: translateY(-2px) scale(1.02); border-color: var(--meet-green-primary); }

.tile.minimized .top-pill { font-size: 9px; padding: 4px 10px; top: 12px; left: 12px; }
.tile.minimized .user-tag { padding: 6px 12px; bottom: 12px; left: 12px; gap: 8px; }
.tile.minimized .avatar { width: 24px; height: 24px; font-size: 11px; }
.tile.minimized .info strong { font-size: 11px; }
.tile.minimized .info span { display: none; }
.tile.minimized .placeholder h2, .tile.minimized .placeholder p { display: none; }
.tile.minimized .medical { width: 40px; height: 40px; font-size: 20px; border-radius: 12px; }
.tile.minimized .pulse-ring { display: none; }

.placeholder {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; text-align: center;
  background: linear-gradient(180deg, #ffffff, #f8fafc); padding: 24px; z-index: 1;
}
.medical {
  width: 64px; height: 64px; border-radius: 20px;
  background: linear-gradient(135deg, var(--meet-green-primary), #0F9D58);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 30px; box-shadow: 0 8px 20px rgba(52,168,83,0.15);
  position: relative; z-index: 2;
}

/* Premium Visualizer Animations */
.live-pulse-container { position: relative; display: flex; align-items: center; justify-content: center; }
.pulse-ring { position: absolute; width: 84px; height: 84px; border: 2px solid var(--meet-green-primary); border-radius: 26px; animation: visualPulse 2.5s infinite ease-out; opacity: 0; z-index: 1; }
@keyframes visualPulse {
  0% { transform: scale(0.8); opacity: 0.6; }
  100% { transform: scale(1.4); opacity: 0; }
}

.placeholder h2 { font-size: 18px; font-weight: 600; color: var(--text); }
.placeholder p { max-width: 320px; color: var(--muted); font-size: 13px; line-height: 1.5; }

.top-pill {
  position: absolute; top: 20px; left: 20px; z-index: 2; padding: 8px 16px; border-radius: 999px;
  background: rgba(255,255,255,0.95); border: 1px solid var(--border); color: var(--meet-green-dark);
  font-size: 11px; font-weight: 700; letter-spacing: 0.5px; box-shadow: var(--shadow-sm);
}
.user-tag {
  position: absolute; left: 20px; bottom: 20px; z-index: 2; display: flex; align-items: center; gap: 12px;
  padding: 10px 20px; border-radius: 999px; background: rgba(255,255,255,.98);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
}
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--meet-green-primary), var(--meet-green-dark));
  color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
}
.info strong { font-size: 14px; display: block; color: var(--text); }
.info span { font-size: 12px; color: var(--muted); display: block; }

/* Premium Button Deck System */
.footer-deck-wrapper { display: flex; justify-content: center; align-items: center; width: 100%; height: 84px; flex: 0 0 84px; }
.footer-deck {
  background: #ffffff; border: 1px solid rgba(226, 232, 240, 0.8); border-radius: 20px;
  padding: 10px 14px; display: flex; align-items: center; gap: 12px;
  box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 12px -2px rgba(0, 0, 0, 0.03);
}
.ctrl {
  width: 48px; height: 48px; border: 1px solid #e2e8f0; border-radius: 14px; background: #ffffff;
  color: #475569; display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.ctrl:hover { background: #f8fafc; border-color: #cbd5e1; color: #0f172a; transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.04); }
.ctrl svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.2s; }
.ctrl:hover svg { transform: scale(1.06); }
.ctrl.off { background: #fef2f2 !important; border-color: #fee2e2 !important; color: #ef4444 !important; }
.ctrl.active-chat { background: #f0fdf4 !important; border-color: #dcfce7 !important; color: #16a34a !important; }
.ctrl.hang { width: 68px; border-radius: 14px; background: #ef4444 !important; border-color: #ef4444 !important; color: #ffffff !important; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.25) !important; }

/* Chat & Rx Panel Layout */
.sidebar-panel {
  background: var(--panel); border-radius: 24px; box-shadow: var(--shadow-island);
  border: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; overflow: hidden; 
}
.sidebar-header {
  padding: 16px 24px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; background: #fcfdfd;
}
.tabs { display: flex; gap: 8px; background: var(--bg-app); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
.tab-btn {
  border: none; background: transparent; padding: 8px 16px; border-radius: 8px;
  font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all 0.2s;
}
.tab-btn.active { background: #fff; color: var(--meet-green-dark); box-shadow: var(--shadow-sm); }
.close-chat-btn { background: var(--bg-app); border: 1px solid var(--border); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; color: var(--muted); }

/* View Containers */
.view-container { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.view-container.active { display: flex; }

/* Chat specific */
.messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.msg { padding: 14px 18px; border-radius: 20px; font-size: 14px; max-width: 85%; line-height: 1.5; word-wrap: break-word; box-shadow: var(--shadow-sm); }
.system { border: 1px solid var(--border); color: var(--muted); background: var(--bg-app); align-self: center; font-size: 12px; text-align: center; border-radius: 999px; padding: 10px 20px; }
.me { margin-left: auto; color: #fff; background: linear-gradient(135deg, var(--meet-green-primary), var(--meet-green-dark)); border-bottom-right-radius: 4px; }
.chat-img-wrap { margin-left: auto; max-width: 85%; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.chat-img-wrap img { max-width: 100%; border-radius: 16px; border: 1px solid var(--border); cursor: pointer; box-shadow: var(--shadow-sm); }
.inline-print-btn { background: var(--panel); border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
.inline-print-btn:hover { background: var(--bg-app); color: var(--text); border-color: var(--muted); }

/* Prescription Chat Card */
.rx-chat-card {
  margin-left: auto; background: #ffffff; color: var(--text); border: 1px solid var(--meet-green-primary); 
  border-radius: 16px; border-bottom-right-radius: 4px; padding: 0; box-shadow: 0 4px 12px rgba(52,168,83,0.15);
  width: 90%; overflow: hidden;
}
.rx-chat-header {
  background: var(--meet-green-light); padding: 12px 16px; font-weight: 600; color: var(--meet-green-dark);
  display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #cce8d6;
}
.rx-chat-header .icon { font-size: 18px; font-family: serif; }
.rx-chat-body { padding: 16px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.rx-chat-body strong { color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
.rx-chat-footer { padding: 12px 16px; background: #f8fafc; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }
.rx-chat-footer .inline-print-btn { background: var(--meet-green-primary); color: white; border: none; }
.rx-chat-footer .inline-print-btn:hover { background: var(--meet-green-dark); transform: translateY(-1px); }

/* Chat Input */
.chat-input-area { padding: 20px 24px; border-top: 1px solid var(--border); background: #fcfdfd; }
.upload-preview-bar { display: none; align-items: center; gap: 12px; background: var(--bg-app); padding: 10px 14px; border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
.preview-thumbnail { width: 44px; height: 44px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
.remove-preview-btn { background: var(--text); color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; }
.input-wrap { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 24px; padding: 6px 6px 6px 14px; }
.input-wrap input[type="text"] { flex: 1; border: none; outline: none; font-size: 14px; background: transparent; padding: 10px 0; color: var(--text); }
.icon-btn { background: transparent; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; color: var(--muted); }
.send { background: linear-gradient(135deg, var(--meet-green-primary), var(--meet-green-dark)); color: #fff; border: none; border-radius: 50%; width: 42px; height: 42px; cursor: pointer; }

/* Prescription (Rx) specific */
.rx-form { padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background: #fcfdfd; flex: 1; }
.rx-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.rx-header h3 { font-size: 18px; color: var(--text); font-weight: 600; }
.rx-icon { width: 32px; height: 32px; background: var(--meet-green-light); color: var(--meet-green-dark); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
.rx-field { display: flex; flex-direction: column; gap: 6px; }
.rx-field label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.rx-input { padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; font-family: inherit; background: var(--panel); outline: none; transition: border 0.2s; }
.rx-input:focus { border-color: var(--meet-green-primary); }
textarea.rx-input { resize: vertical; min-height: 80px; }

/* Rx Dual Actions */
.rx-action-deck { display: flex; gap: 12px; margin-top: 10px; }
.btn-primary, .btn-secondary {
  flex: 1; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; border: none;
}
.btn-primary {
  background: linear-gradient(135deg, var(--meet-green-primary), var(--meet-green-dark)); color: white;
  box-shadow: 0 6px 16px rgba(52,168,83,0.2);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(52,168,83,0.3); }
.btn-secondary {
  background: var(--bg-app); color: var(--meet-green-dark); border: 1px solid #cce8d6;
}
.btn-secondary:hover { background: var(--meet-green-light); border-color: var(--meet-green-primary); transform: translateY(-2px); }

/* Landing Background */
.overlay { position: fixed; inset: 0; background: #f4f7fa; overflow: hidden; display: flex; align-items: center; justify-content: center; z-index: 200; }
.overlay.hide { display: none; }
.overlay-bg-decor { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.bg-grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(52, 168, 83, 0.12) 1.5px, transparent 1.5px); background-size: 28px 28px; opacity: 0.85; }
.bg-aura-blob { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.45; animation: fluidPulse 22s infinite alternate ease-in-out; }
.blob-primary { width: 550px; height: 550px; background: linear-gradient(135deg, rgba(52,168,83,0.8), rgba(15,157,88,0.6)); top: -12%; left: -8%; }
.blob-secondary { width: 650px; height: 650px; background: linear-gradient(135deg, rgba(19,115,51,0.7), rgba(66,133,244,0.5)); bottom: -15%; right: -10%; animation-delay: -6s; }
@keyframes fluidPulse { 0% { transform: translate(0px, 0px) scale(1) rotate(0deg); } 33% { transform: translate(50px, 40px) scale(1.08) rotate(120deg); } 66% { transform: translate(-30px, 60px) scale(0.95) rotate(240deg); } 100% { transform: translate(0px, 0px) scale(1) rotate(360deg); } }

/* Landing Card */
.card { position: relative; z-index: 5; width: 90%; max-width: 480px; background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(20px); border-radius: 36px; border: 1px solid rgba(255, 255, 255, 0.65); padding: 56px 48px; box-shadow: 0 24px 64px -12px rgba(0,0,0,0.08); text-align: center; }
.card-logo-container { display: flex; justify-content: center; margin-bottom: 28px; }
.card-logo { width: 72px; height: 72px; border-radius: 22px; background: linear-gradient(135deg, var(--meet-green-primary), var(--meet-green-dark)); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 36px; box-shadow: 0 12px 28px rgba(52,168,83,0.3); }
.card small { color: var(--meet-green-dark); font-weight: 700; letter-spacing: 1px; font-size: 13px; display: block; margin-bottom: 12px; }
.card h1 { font-size: 30px; font-weight: 600; margin-bottom: 16px; }
.card p { font-size: 15px; color: var(--muted); line-height: 1.6; margin-bottom: 36px; }
.join-box { display: flex; flex-direction: column; gap: 16px; }
.join-box input { height: 60px; border-radius: 16px; border: 1px solid var(--border); padding: 0 24px; font-size: 16px; outline: none; background: rgba(241, 245, 249, 0.8); text-align: center; transition: all 0.2s; }
.join-box input:focus { background: #ffffff; border-color: var(--meet-green-primary); box-shadow: 0 0 0 4px var(--meet-green-light); }
.join-box button { height: 60px; border-radius: 16px; border: none; background: linear-gradient(135deg, var(--meet-green-primary), var(--meet-green-dark)); color: #fff; font-weight: 700; font-size: 17px; cursor: pointer; }

/* Lightbox */
.lightbox-overlay { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.98); z-index: 300; display: none; justify-content: center; align-items: center; flex-direction: column; }
.lightbox-content { max-width: 85vw; max-height: 75vh; border-radius: 20px; box-shadow: var(--shadow-island); border: 1px solid var(--border); }
.lightbox-controls { position: absolute; top: 32px; right: 32px; display: flex; gap: 16px; }
.print-action-btn, .close-lightbox-btn { padding: 14px 24px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; border: none; }
.print-action-btn { background: var(--meet-green-primary); color: white; }
.close-lightbox-btn { background: var(--panel); color: var(--text); border: 1px solid var(--border); }

@media(max-width: 900px) {
  body { padding: 12px; gap: 12px; }
  .header { padding: 0 16px; height: 64px; border-radius: 20px; }
  .main { grid-template-columns: 1fr; }
  body.chat-open .sidebar-panel { position: fixed; right: 12px; top: 88px; bottom: 12px; z-index: 100; width: calc(100% - 24px); max-width: 420px; }
  .tile.minimized { width: 140px; height: 79px; bottom: 12px; right: 12px; }
  .tile.minimized .user-tag, .tile.minimized .top-pill { display: none; }
}
</style>
</head>
<body class="chat-open">

<header class="header">
  <div class="brand">
    <div class="logo">☤</div>
    <h1>Telehealth Workspace</h1>
  </div>
  <div class="connection">
    <div class="dot"></div>
    <span id="statusText">Disconnected</span>
  </div>
</header>

<div class="main">
  <section class="workspace">
    <div class="video-stage" id="videoGrid"></div>
    <div class="footer-deck-wrapper">
      <section class="footer-deck">
        <button class="ctrl" id="micBtn" aria-label="Mute"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"></rect><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="21" x2="12" y2="23"></line><line x1="9" y1="23" x2="15" y2="23"></line></svg></button>
        <button class="ctrl" id="camBtn" aria-label="Camera"><svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="3" ry="3"></rect></svg></button>
        <button class="ctrl active-chat" id="chatBtn" aria-label="Sidebar"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><line x1="8" y1="8" x2="16" y2="8" stroke-width="1.8" opacity="0.7"></line><line x1="8" y1="12" x2="14" y2="12" stroke-width="1.8" opacity="0.7"></line></svg></button>
        <button class="ctrl hang" id="hangBtn" aria-label="Leave"><svg viewBox="0 0 24 24"><path d="M10.68 13.31a16 16 0 0 0 2.64 0 2.5 2.5 0 0 1 1.91.75l1.63 1.63a1 1 0 0 0 1.41 0l2.44-2.44a1 1 0 0 0 0-1.41l-1.63-1.63a2.5 2.5 0 0 1-.75-1.91 16 16 0 0 0-12.68 0 2.5 2.5 0 0 1-.75 1.91l-1.63 1.63a1 1 0 0 0 0 1.41l2.44 2.44a1 1 0 0 0 1.41 0l1.63-1.63a2.5 2.5 0 0 1 1.91-.75z"></path></svg></button>
      </section>
    </div>
  </section>

  <aside class="sidebar-panel" id="sidebarDrawer">
    <div class="sidebar-header">
      <div class="tabs">
        <button class="tab-btn active" id="tabChatBtn">Messages</button>
        <button class="tab-btn" id="tabRxBtn">Prescribe (Rx)</button>
      </div>
      <button class="close-chat-btn" id="closeChatBtn">&times;</button>
    </div>

    <div class="view-container active" id="viewChat">
      <div class="messages" id="messages">
        <div class="msg system">Messages are end-to-end encrypted.</div>
      </div>
      <div class="chat-input-area">
        <div class="upload-preview-bar" id="uploadPreviewBar">
          <img src="" alt="Thumbnail" class="preview-thumbnail" id="previewThumb">
          <button type="button" class="remove-preview-btn" id="removePreviewBtn">&times;</button>
        </div>
        <form class="input-wrap" id="chatForm">
          <input type="file" id="photoInput" accept="image/*" style="display:none;">
          <button type="button" class="icon-btn" id="triggerFileBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg></button>
          <input id="chatInput" type="text" placeholder="Send a message..." autocomplete="off">
          <button class="send" type="submit">➜</button>
        </form>
      </div>
    </div>

    <div class="view-container" id="viewRx">
      <div class="rx-form">
        <div class="rx-header">
          <div class="rx-icon">℞</div>
          <h3>Digital Prescription</h3>
        </div>
        
        <div class="rx-field">
          <label>Patient Name</label>
          <input type="text" id="rxPatient" class="rx-input" placeholder="e.g. John Doe">
        </div>
        
        <div class="rx-field">
          <label>Medication Name</label>
          <input type="text" id="rxMeds" class="rx-input" placeholder="e.g. Amoxicillin">
        </div>
        
        <div class="rx-field">
          <label>Dosage strength</label>
          <input type="text" id="rxDosage" class="rx-input" placeholder="e.g. 500mg">
        </div>
        
        <div class="rx-field">
          <label>Frequency & Duration</label>
          <input type="text" id="rxFreq" class="rx-input" placeholder="e.g. 1 Tablet twice daily for 5 days">
        </div>

        <div class="rx-field">
          <label>Doctor's Notes</label>
          <textarea id="rxNotes" class="rx-input" placeholder="Take after meals..."></textarea>
        </div>
        
        <div class="rx-action-deck">
          <button class="btn-secondary" id="sendChatRxBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg> Send to Chat
          </button>
          <button class="btn-primary" id="directPrintRxBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg> Print Doc
          </button>
        </div>
      </div>
    </div>
  </aside>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-bg-decor">
    <div class="bg-grid"></div>
    <div class="bg-aura-blob blob-primary"></div>
    <div class="bg-aura-blob blob-secondary"></div>
  </div>
  <div class="card">
    <div class="card-logo-container"><div class="card-logo">☤</div></div>
    <small>TELEHEALTH SECURE NETWORKS</small>
    <h1>Clinical Workspace</h1>
    <p>Review patient analytics, drop secure files, and host real-time medical group consultations in an isolated sandbox pipeline.</p>
    <div class="join-box">
      <input id="nameInput" type="text" placeholder="Enter workspace display name">
      <button id="joinBtn">Join Workspace</button>
    </div>
  </div>
</div>

<div class="lightbox-overlay" id="lightboxOverlay">
  <div class="lightbox-controls">
    <button class="print-action-btn" id="printImageBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg> Print Image</button>
    <button class="close-lightbox-btn" id="closeLightboxBtn">Close</button>
  </div>
  <img src="" alt="Expanded View" class="lightbox-content" id="lightboxImg">
</div>

<script>
// WebRTC & Environment-Adaptive UI Logic
const videoGrid = document.getElementById('videoGrid');
const micBtn = document.getElementById('micBtn');
const camBtn = document.getElementById('camBtn');
const chatBtn = document.getElementById('chatBtn');
const closeChatBtn = document.getElementById('closeChatBtn');
const hangBtn = document.getElementById('hangBtn');
const overlay = document.getElementById('overlay');
const joinBtn = document.getElementById('joinBtn');
const nameInput = document.getElementById('nameInput');
const statusText = document.getElementById('statusText');

let stream = null; let micOn = true; let camOn = true;

function createParticipantTile(name, type = 'remote', streamObject = null) {
  const tile = document.createElement('div');
  tile.className = 'tile';
  const initials = name.charAt(0).toUpperCase();

  tile.innerHTML = `
    <div class='top-pill'>${type === 'local' ? 'LOCAL USER' : 'REMOTE NODE'}</div>
    <video ${type === 'local' ? 'muted' : ''} autoplay playsinline></video>
    <div class='placeholder'>
      <div class='live-pulse-container'>
        <div class='pulse-ring'></div>
        <div class='medical'>${type === 'local' ? '☤' : '⏳'}</div>
      </div>
      <h2>${type === 'local' ? 'Live Clinical Feed' : 'Establishing Secure Node...'}</h2>
      <p>${type === 'local' ? 'Camera active inside secure sandbox container.' : 'Connecting to remote medical terminal.'}</p>
    </div>
    <div class='user-tag'><div class='avatar'>${initials}</div><div class='info'><strong>${name}</strong><span>${type === 'local' ? 'Host' : 'Connecting...'}</span></div></div>
  `;

  const video = tile.querySelector('video');
  const placeholder = tile.querySelector('.placeholder');
  if (type === 'local') video.style.transform = 'scaleX(-1)';

  if (streamObject) {
    video.srcObject = streamObject;
    video.onloadedmetadata = () => { video.play(); placeholder.style.display = 'none'; };
  } else {
    placeholder.style.display = 'flex';
  }
  return { tile, video, placeholder };
}

async function joinWorkspace() {
  joinBtn.disabled = true; joinBtn.textContent = 'Allocating Ports...';
  const name = nameInput.value.trim() || 'You';
  videoGrid.innerHTML = '';

  // Fail-Safe Hardware Fallback Wrapper
  try { 
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: true }); 
    } else {
      throw new Error('Sandbox strict restriction');
    }
  } catch (e) { 
    console.warn('Hardware block encountered. Launching clean graphical environment simulator layers.'); 
  }

  document.body.classList.add('joined');
  statusText.textContent = name + " (Live)";
  overlay.classList.add('hide');

  const localObj = createParticipantTile(name, 'local', stream);
  const remoteObj = createParticipantTile('Consulting Peer', 'remote', null);

  remoteObj.tile.classList.add('maximized');
  localObj.tile.classList.add('minimized');

  [localObj.tile, remoteObj.tile].forEach(tile => {
    tile.addEventListener('click', function() {
      if (this.classList.contains('minimized')) {
        const currentMax = videoGrid.querySelector('.maximized');
        if (currentMax) { currentMax.classList.remove('maximized'); currentMax.classList.add('minimized'); }
        this.classList.remove('minimized'); this.classList.add('maximized');
      }
    });
  });
  
  videoGrid.appendChild(remoteObj.tile); 
  videoGrid.appendChild(localObj.tile);

  // Automation Pipeline: Simulate incoming active connection trace after 1.5s
  setTimeout(() => {
    const remotePlaceholder = remoteObj.tile.querySelector('.placeholder');
    const remoteTagSpan = remoteObj.tile.querySelector('.user-tag .info span');
    
    if (remotePlaceholder) {
      remotePlaceholder.innerHTML = `
        <div class="live-pulse-container">
          <div class="pulse-ring" style="animation-delay: -0.5s; border-color: #4285F4;"></div>
          <div class="medical" style="background: linear-gradient(135deg, #4285F4, #1a73e8);">👤</div>
        </div>
        <h2 style="color: #1e293b; margin-top: 4px;">Consulting Peer Live</h2>
        <p style="color: #16a34a; font-weight: 600; font-size: 13px;">🟢 Connected • Stream Encrypted</p>
      `;
      remotePlaceholder.style.background = 'linear-gradient(180deg, #ffffff, #e8f0fe)';
    }
    if (remoteTagSpan) remoteTagSpan.textContent = 'Connected';
  }, 1500);
}

joinBtn.addEventListener('click', joinWorkspace);
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); joinWorkspace(); } });

micBtn.addEventListener('click', () => { if(!stream) return; micOn = !micOn; stream.getAudioTracks().forEach(t => t.enabled = micOn); micBtn.classList.toggle('off', !micOn); });
camBtn.addEventListener('click', () => { if(!stream) return; camOn = !camOn; stream.getVideoTracks().forEach(t => t.enabled = camOn); camBtn.classList.toggle('off', !camOn); });

function toggleChatPanel() {
  document.body.classList.toggle('chat-collapsed');
  chatBtn.classList.toggle('active-chat', !document.body.classList.contains('chat-collapsed'));
}
chatBtn.addEventListener('click', toggleChatPanel);
closeChatBtn.addEventListener('click', toggleChatPanel);

// Sidebar Tabs Logic
const tabChatBtn = document.getElementById('tabChatBtn');
const tabRxBtn = document.getElementById('tabRxBtn');
const viewChat = document.getElementById('viewChat');
const viewRx = document.getElementById('viewRx');

function openChatTab() {
  tabChatBtn.classList.add('active'); tabRxBtn.classList.remove('active');
  viewChat.classList.add('active'); viewRx.classList.remove('active');
}
tabChatBtn.addEventListener('click', openChatTab);
tabRxBtn.addEventListener('click', () => {
  tabRxBtn.classList.add('active'); tabChatBtn.classList.remove('active');
  viewRx.classList.add('active'); viewChat.classList.remove('active');
});

hangBtn.addEventListener('click', () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  overlay.classList.remove('hide'); document.body.classList.remove('joined');
  statusText.textContent = 'Disconnected'; videoGrid.innerHTML = '';
  joinBtn.disabled = false; joinBtn.textContent = 'Join Workspace';
});

// ==========================================
// NEW PRESCRIPTION LOGIC (High-End Template)
// ==========================================

function getRxData() {
  return {
    patient: document.getElementById('rxPatient').value || '_______________________',
    meds: document.getElementById('rxMeds').value || '_______________________',
    dosage: document.getElementById('rxDosage').value || '',
    freq: document.getElementById('rxFreq').value || 'As directed',
    notes: document.getElementById('rxNotes').value || '',
    dateStr: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
  };
}

window.executePrintRx = function(dataStr) {
  const data = typeof dataStr === 'string' ? JSON.parse(decodeURIComponent(dataStr)) : dataStr;
  
  const rxHTML = `
    <html>
      <head>
        <title>Prescription - ${data.patient}</title>
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap');
          @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
          
          body { 
            font-family: 'Inter', sans-serif; padding: 0; margin: 0; color: #0f172a; 
            display: flex; justify-content: center; background: white;
          }
          
          .rx-container {
            width: 100%; max-width: 800px; padding: 50px; position: relative;
            background: #ffffff; min-height: 100vh; box-sizing: border-box;
          }
          
          .watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 400px; font-family: 'Libre Baskerville', serif; color: rgba(19, 115, 51, 0.04);
            z-index: 0; pointer-events: none; margin: 0; padding: 0; line-height: 1;
          }
          
          .content { position: relative; z-index: 10; }
          
          .header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 4px solid #137333; padding-bottom: 25px; margin-bottom: 35px; }
          .clinic-logo { display: flex; align-items: center; gap: 12px; }
          .logo-mark { font-size: 38px; color: #137333; line-height: 1; }
          .clinic-info h1 { font-family: 'Libre Baskerville', serif; margin: 0 0 4px 0; color: #137333; font-size: 26px; font-weight: 700; }
          .clinic-info p { margin: 0; color: #64748b; font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
          
          .doc-meta { text-align: right; }
          .doc-meta p { margin: 0 0 6px 0; font-size: 14px; color: #475569; }
          .doc-meta strong { color: #0f172a; }
          
          .patient-block {
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px;
            padding: 20px 25px; display: flex; justify-content: space-between; margin-bottom: 40px;
          }
          .patient-block div h3 { font-size: 12px; text-transform: uppercase; color: #64748b; margin: 0 0 8px 0; letter-spacing: 0.5px; }
          .patient-block div p { font-size: 18px; font-weight: 600; margin: 0; color: #0f172a; }
          
          .rx-symbol { font-family: 'Libre Baskerville', serif; font-size: 72px; color: #137333; line-height: 1; margin: 0 0 20px 0; }
          
          .medication-block { padding-left: 20px; border-left: 3px solid #e2e8f0; margin-bottom: 40px; }
          .medication-block h2 { font-size: 24px; font-weight: 700; margin: 0 0 10px 0; display: flex; align-items: baseline; gap: 10px; }
          .medication-block h2 span.dose { font-size: 18px; font-weight: 500; color: #475569; }
          .sig { font-size: 16px; margin: 0 0 15px 0; color: #334155; line-height: 1.6; }
          .sig strong { color: #0f172a; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; margin-right: 5px; }
          
          .notes { background: #fffbeb; padding: 16px 20px; border-radius: 8px; border-left: 4px solid #f59e0b; color: #78350f; font-size: 14px; line-height: 1.5; }
          
          .footer { margin-top: 80px; display: flex; justify-content: space-between; align-items: flex-end; }
          .security-notice { font-size: 11px; color: #94a3b8; max-width: 350px; line-height: 1.5; }
          .signature-box { width: 280px; text-align: center; }
          .sig-line { border-bottom: 1px solid #0f172a; height: 40px; margin-bottom: 8px; }
          .signature-box p { margin: 0; font-size: 13px; color: #0f172a; font-weight: 600; text-transform: uppercase; }
          .signature-box span { font-size: 11px; color: #64748b; }
        </style>
      </head>
      <body>
        <div class="rx-container">
          <div class="watermark">℞</div>
          <div class="content">
            <div class="header">
              <div class="clinic-logo">
                <div class="logo-mark">☤</div>
                <div class="clinic-info">
                  <h1>Telehealth Clinical Network</h1>
                  <p>Verified Digital E-Prescription</p>
                </div>
              </div>
              <div class="doc-meta">
                <p><strong>Date:</strong> ${data.dateStr}</p>
                <p><strong>Ref:</strong> ${Math.random().toString(36).substring(2, 10).toUpperCase()}</p>
              </div>
            </div>
            
            <div class="patient-block">
              <div>
                <h3>Patient Name</h3>
                <p>${data.patient}</p>
              </div>
            </div>

            <div class="rx-symbol">℞</div>
            
            <div class="medication-block">
              <h2>${data.meds} ${data.dosage ? `<span class="dose">— ${data.dosage}</span>` : ''}</h2>
              <p class="sig"><strong>Sig:</strong> ${data.freq}</p>
              ${data.notes ? `<div class="notes"><strong>Clinical Notes:</strong><br>${data.notes}</div>` : ''}
            </div>

            <div class="footer">
              <div class="security-notice">
                CONFIDENTIALITY NOTICE:<br>
                This document was generated securely via Telemedicine Portal. It contains confidential health information legally privileged and intended only for the use of the individual named above.
              </div>
              <div class="signature-box">
                <div class="sig-line"></div>
                <p>Authorized Signature</p>
                <span>Electronically Signed</span>
              </div>
            </div>
          </div>
        </div>
      </body>
    </html>
  `;

  const printFrame = document.createElement('iframe');
  printFrame.style.position = 'absolute'; printFrame.style.width = '0px'; printFrame.style.height = '0px'; printFrame.style.border = 'none';
  document.body.appendChild(printFrame);
  
  const pDoc = printFrame.contentWindow.document;
  pDoc.open(); pDoc.write(rxHTML); pDoc.close();

  setTimeout(() => {
    printFrame.contentWindow.focus();
    printFrame.contentWindow.print();
    setTimeout(() => { document.body.removeChild(printFrame); }, 500);
  }, 300);
};

// Button 1: Direct Print
document.getElementById('directPrintRxBtn').addEventListener('click', () => {
  window.executePrintRx(getRxData());
});

// Button 2: Send to Chat
document.getElementById('sendChatRxBtn').addEventListener('click', () => {
  const data = getRxData();
  const encodedData = encodeURIComponent(JSON.stringify(data));
  
  const cardDiv = document.createElement('div');
  cardDiv.className = 'rx-chat-card';
  cardDiv.innerHTML = `
    <div class="rx-chat-header"><span class="icon">℞</span> Official Prescription Generated</div>
    <div class="rx-chat-body">
      <div><strong>Patient:</strong><br>${data.patient}</div>
      <div><strong>Medication:</strong><br>${data.meds} ${data.dosage ? `(${data.dosage})` : ''}</div>
      <div><strong>Sig:</strong><br>${data.freq}</div>
    </div>
    <div class="rx-chat-footer">
      <button class="inline-print-btn" onclick="window.executePrintRx('${encodedData}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
        Print Document
      </button>
    </div>
  `;
  
  messages.appendChild(cardDiv);
  
  document.getElementById('rxPatient').value = '';
  document.getElementById('rxMeds').value = '';
  document.getElementById('rxDosage').value = '';
  document.getElementById('rxFreq').value = '';
  document.getElementById('rxNotes').value = '';
  
  openChatTab();
  messages.scrollTop = messages.scrollHeight;
});


// Chat & Image Print Logic
const chatForm = document.getElementById('chatForm');
const chatInput = document.getElementById('chatInput');
const messages = document.getElementById('messages');
const photoInput = document.getElementById('photoInput');
const triggerFileBtn = document.getElementById('triggerFileBtn');
const uploadPreviewBar = document.getElementById('uploadPreviewBar');
const previewThumb = document.getElementById('previewThumb');
const removePreviewBtn = document.getElementById('removePreviewBtn');
const lightboxOverlay = document.getElementById('lightboxOverlay');
const lightboxImg = document.getElementById('lightboxImg');
const closeLightboxBtn = document.getElementById('closeLightboxBtn');
const printImageBtn = document.getElementById('printImageBtn');
let pendingImageBase64 = null;

triggerFileBtn.addEventListener('click', () => photoInput.click());
photoInput.addEventListener('change', (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => { pendingImageBase64 = event.target.result; previewThumb.src = pendingImageBase64; uploadPreviewBar.style.display = 'flex'; };
  reader.readAsDataURL(file);
});
removePreviewBtn.addEventListener('click', () => { pendingImageBase64 = null; photoInput.value = ''; uploadPreviewBar.style.display = 'none'; });

function execPrintImg(targetSrc) {
  if (!targetSrc) return;
  const printFrame = document.createElement('iframe');
  printFrame.style.position = 'absolute'; printFrame.style.width = '0px'; printFrame.style.height = '0px'; printFrame.style.border = 'none';
  document.body.appendChild(printFrame);
  const pDoc = printFrame.contentWindow.document;
  pDoc.open();
  pDoc.write(`<html><head><style>@media print{ body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;} img{max-width:100%;max-height:100vh;object-fit:contain;} }</style></head><body><img src="${targetSrc}" onload="window.print(); setTimeout(function(){ window.parent.document.body.removeChild(window.frameElement); }, 400);"></body></html>`);
  pDoc.close();
}

chatForm.addEventListener('submit', e => {
  e.preventDefault();
  const text = chatInput.value.trim();
  if (!text && !pendingImageBase64) return;
  if (text) {
    const textBubble = document.createElement('div');
    textBubble.className = 'msg me'; textBubble.textContent = text; messages.appendChild(textBubble);
  }
  if (pendingImageBase64) {
    const imgWrap = document.createElement('div'); imgWrap.className = 'chat-img-wrap';
    const img = document.createElement('img'); img.src = pendingImageBase64;
    img.onclick = () => { lightboxImg.src = img.src; lightboxOverlay.style.display = 'flex'; };
    const inlinePrint = document.createElement('button'); inlinePrint.className = 'inline-print-btn';
    inlinePrint.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg> Print';
    const imgSrcCapture = pendingImageBase64; inlinePrint.onclick = () => execPrintImg(imgSrcCapture);
    imgWrap.appendChild(img); imgWrap.appendChild(inlinePrint); messages.appendChild(imgWrap);
  }
  chatInput.value = ''; pendingImageBase64 = null; photoInput.value = ''; uploadPreviewBar.style.display = 'none'; messages.scrollTop = messages.scrollHeight;
});

closeLightboxBtn.addEventListener('click', () => { lightboxOverlay.style.display = 'none'; lightboxImg.src = ''; });
printImageBtn.addEventListener('click', () => execPrintImg(lightboxImg.src));
</script>
</body>
</html>
