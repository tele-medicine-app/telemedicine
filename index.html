<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Telemedicine Sync</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="chat-open">

<div class="landing-overlay" id="landingPage">
  <div class="landing-card">
    <div class="medical">☤</div>
    <div>
      <p style="color: var(--meet-green-primary); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Telehealth Secure Networks</p>
      <h2>Clinical Workspace</h2>
    </div>
    <p>Review patient analytics, drop secure files, and host real-time medical group consultations in an isolated sandbox pipeline.</p>
    <button type="button" class="btn-join-direct" id="startSessionBtn">Join Workspace</button>
  </div>
</div>

<header class="header">
  <div class="brand">
    <div class="logo">☤</div>
    <h1>Telemedicine Sync</h1>
  </div>
  <div class="connection">
    <div class="dot"></div>
    <span id="statusText">Disconnected</span>
  </div>
</header>

<div class="main">
  <section class="workspace">
    <div class="video-stage" id="videoGrid"></div>
    <div class="footer-deck-wrapper">
      <section class="footer-deck">
        <button class="ctrl" id="micBtn" aria-label="Mute"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"></rect><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="21" x2="12" y2="23"></line><line x1="9" y1="23" x2="15" y2="23"></line></svg></button>
        <button class="ctrl" id="camBtn" aria-label="Camera"><svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="3" ry="3"></rect></svg></button>
        <button class="ctrl active-chat" id="chatBtn" aria-label="Sidebar"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><line x1="8" y1="8" x2="16" y2="8" stroke-width="1.8" opacity="0.7"></line><line x1="8" y1="12" x2="14" y2="12" stroke-width="1.8" opacity="0.7"></line></svg></button>
        <button class="ctrl hang" id="hangBtn" aria-label="Leave">
          <svg viewBox="0 0 24 24" style="fill: currentColor !important; stroke: none !important; width: 24px; height: 24px;">
            <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39.23.74.56.9.98.49 2.04.74 3.15.74s2.17-.26 3.15-.74c.32-.15.56-.51.56-.9v-3.1c-1.45-.47-3-.72-4.6-.72z"/>
          </svg>
        </button>
      </section>
    </div>
  </section>

  <aside class="sidebar-panel" id="sidebarDrawer">
    <div class="sidebar-header">
      <div class="tabs">
        <button class="tab-btn active" id="tabChatBtn">Messages</button>
        <button class="tab-btn" id="tabRxBtn">Prescribe (Rx)</button>
      </div>
      <button class="close-chat-btn" id="closeChatBtn">&times;</button>
    </div>

    <div class="view-container active" id="viewChat">
      <div class="messages" id="messages">
        <div class="msg system">Messages are end-to-end encrypted.</div>
      </div>
      <div class="chat-input-area">
        <div class="upload-preview-bar" id="uploadPreviewBar">
          <img src="" alt="Thumbnail" class="preview-thumbnail" id="previewThumb">
          <button type="button" class="remove-preview-btn" id="removePreviewBtn">&times;</button>
        </div>
        <form class="input-wrap" id="chatForm">
          <input type="file" id="photoInput" accept="image/*" style="display:none;">
          <button type="button" class="icon-btn" id="triggerFileBtn" title="Attach Image"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg></button>
          <input id="chatInput" type="text" placeholder="Send a message..." autocomplete="off">
          <button class="send" type="submit">➜</button>
        </form>
      </div>
    </div>

    <div class="view-container" id="viewRx">
      <div class="rx-form">
        <div class="rx-header">
          <div class="rx-icon">℞</div>
          <h3>Digital Prescription</h3>
        </div>
        
        <div class="rx-field">
          <label>Patient Name</label>
          <input type="text" id="rxPatient" class="rx-input" placeholder="e.g. John Doe">
        </div>
        
        <div id="rxMedsContainer">
          <div class="med-group">
            <div class="med-row-header">
              <label style="font-size: 11px; font-weight: 700; color: var(--meet-green-dark); text-transform: uppercase; letter-spacing: 0.5px;">Medication #1</label>
            </div>
            <div class="rx-field">
              <label>Medication Name</label>
              <input type="text" class="rx-input rx-med-name" placeholder="e.g. Amoxicillin">
            </div>
            <div class="rx-field">
              <label>Dosage strength</label>
              <input type="text" class="rx-input rx-med-dosage" placeholder="e.g. 500mg">
            </div>
            <div class="rx-field">
              <label>Frequency & Duration</label>
              <input type="text" class="rx-input rx-med-freq" placeholder="e.g. 1 Tablet twice daily for 5 days">
            </div>
          </div>
        </div>

        <button type="button" class="btn-add-med" id="addMedBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> Add Another Medication
        </button>

        <div class="rx-field">
          <label>Doctor's Notes</label>
          <textarea id="rxNotes" class="rx-input" placeholder="Take after meals..."></textarea>
        </div>
        
        <div class="rx-action-deck">
          <button class="btn-secondary" id="sendChatRxBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg> Send to Chat
          </button>
          <button class="btn-primary" id="directPrintRxBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg> Print Doc
          </button>
        </div>
      </div>
    </div>
  </aside>
</div>

<div class="lightbox-overlay" id="lightboxOverlay">
  <div class="lightbox-controls">
    <button class="print-action-btn" id="printImageBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg> Print Image</button>
    <button class="close-lightbox-btn" id="closeLightboxBtn">Close</button>
  </div>
  <img src="" alt="Expanded View" class="lightbox-content" id="lightboxImg">
</div>

<div class="custom-modal-overlay" id="customAlertModal">
  <div class="custom-modal-card">
    <p id="customAlertText"></p>
    <div class="custom-modal-actions">
      <button class="btn-primary" id="customAlertCloseBtn" style="padding: 12px 32px; height: auto; flex: none;">OK</button>
    </div>
  </div>
</div>

<div class="custom-modal-overlay" id="customConfirmModal">
  <div class="custom-modal-card">
    <p id="customConfirmText"></p>
    <div class="custom-modal-actions">
      <button class="btn-secondary" id="customConfirmCancelBtn" style="padding: 12px 24px; height: auto; margin: 0;">Cancel</button>
      <button class="btn-primary" id="customConfirmOkBtn" style="padding: 12px 24px; height: auto; margin: 0;">Send</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
