<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Telemedicine Sync</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root {
  --bg-app: #f1f5f9;       
  --panel: #ffffff;        
  --text: #1e293b;         
  --muted: #64748b;        
  --border: #e2e8f0;       
  
  --meet-green-primary: #34A853;
  --meet-green-dark: #137333;
  --meet-green-light: #e6f4ea;
  --red: #ea4335;

  --shadow-island: 0 12px 32px -4px rgba(0,0,0,0.06), 0 4px 12px -2px rgba(0,0,0,0.04);
  --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; 
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-app);
  color: var(--text);
  overflow: hidden;
}

.app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
}

header {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
}

.logo-area h1 {
  font-size: 1.25rem;
  color: var(--meet-green-dark);
  display: flex;
  align-items: center;
  gap: 8px;
}

.connection-bar {
  display: flex;
  gap: 12px;
  align-items: center;
}

input {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0.9rem;
  outline: none;
  transition: border 0.2s;
}

input:focus {
  border-color: var(--meet-green-primary);
}

button {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.2s;
}

.btn-primary {
  background: var(--meet-green-primary);
  color: white;
}

.btn-primary:hover {
  background: var(--meet-green-dark);
}

.btn-danger {
  background: var(--red);
  color: white;
}

.main-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
}

.video-workspace {
  flex: 1;
  position: relative;
  background: #111827;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.video-grid {
  width: 100%;
  height: 100%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Remote video takes full container */
#remoteVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 12px;
  background: #1f2937;
}

/* Local picture-in-picture viewport */
#localVideo {
  position: absolute;
  top: 24px;
  right: 24px;
  width: 160px;
  height: 120px;
  object-fit: cover;
  border-radius: 8px;
  box-shadow: var(--shadow-island);
  border: 2px solid rgba(255, 255, 255, 0.2);
  background: #374151;
  z-index: 5;
}

.sidebar-panel {
  width: 380px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.tabs-header {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg-app);
}

.tab-btn {
  flex: 1;
  padding: 12px;
  text-align: center;
  background: none;
  border-radius: 0;
  border-bottom: 2px solid transparent;
  color: var(--muted);
}

.tab-btn.active {
  color: var(--meet-green-dark);
  border-bottom-color: var(--meet-green-primary);
  background: var(--panel);
}

.tab-content {
  flex: 1;
  display: none;
  flex-direction: column;
  padding: 16px;
  overflow-y: auto;
}

.tab-content.active {
  display: flex;
}

#messagesContainer {
  flex: 1;
  overflow-y: auto;
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.chat-msg {
  padding: 8px 12px;
  border-radius: 8px;
  max-width: 80%;
  font-size: 0.9rem;
}

.chat-msg.local {
  background: var(--meet-green-light);
  color: var(--meet-green-dark);
  align-self: flex-end;
}

.chat-msg.remote {
  background: var(--bg-app);
  color: var(--text);
  align-self: flex-start;
}

.chat-input-area {
  display: flex;
  gap: 8px;
}

.chat-input-area input {
  flex: 1;
}

/* Prescription Form Layout */
.rx-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.form-group label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
}

textarea {
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  resize: none;
  height: 80px;
  font-family: inherit;
}

.med-row {
  display: flex;
  gap: 4px;
  margin-bottom: 4px;
}

@media(max-width: 768px) {
  .main-layout { flex-direction: column; }
  .sidebar-panel { width: 100%; height: 40%; }
  #localVideo { width: 100px; height: 75px; top: 12px; right: 12px; }
  .connection-bar { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="logo-area">
      <h1>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        Telemedicine Sync
      </h1>
    </div>
    
    <div class="connection-bar">
      <input type="text" id="myIdInput" placeholder="Your Custom Calling ID" />
      <button id="joinBtn" class="btn-primary">Initialize Engine</button>
      <div style="width: 1px; height: 24px; background: var(--border);"></div>
      <input type="text" id="targetIdInput" placeholder="Remote Peer ID" />
      <button id="connectBtn" class="btn-primary">Connect Call</button>
      <button id="disconnectBtn" class="btn-danger" style="display:none;">End Session</button>
    </div>
  </header>

  <div class="main-layout">
    <div class="video-workspace">
      <div class="video-grid">
        <video id="localVideo" autoplay playsinline muted></video>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
    </div>

    <div class="sidebar-panel">
      <div class="tabs-header">
        <button class="tab-btn active" onclick="switchTab('chatTab')">Clinical Chat</button>
        <button class="tab-btn" onclick="switchTab('rxTab')">℞ Prescription Tool</button>
      </div>

      <div id="chatTab" class="tab-content active">
        <div id="messagesContainer"></div>
        <div class="chat-input-area">
          <input type="text" id="chatInput" placeholder="Type case notes or chat..." />
          <button id="sendChatBtn" class="btn-primary">Send</button>
        </div>
      </div>

      <div id="rxTab" class="tab-content">
        <div class="rx-form">
          <div class="form-group">
            <label>Patient Full Name</label>
            <input type="text" id="rxPatient" placeholder="Jane Doe" />
          </div>
          <div class="form-group">
            <label>Medications & Directions</label>
            <div id="medsList">
              <div class="med-row">
                <input type="text" class="med-name" placeholder="Amoxicillin 500mg" style="flex:2;" />
                <input type="text" class="med-freq" placeholder="1-0-1" style="flex:1;" />
              </div>
            </div>
            <button type="button" onclick="addMedRow()" style="padding:4px; font-size:0.8rem; background:var(--meet-green-light); color:var(--meet-green-dark); margin-top:4px;">+ Add Medication</button>
          </div>
          <div class="form-group">
            <label>Notes / Advice</label>
            <textarea id="rxNotes" placeholder="Take after food. Rest for 3 days."></textarea>
          </div>
          <button id="directPrintRxBtn" class="btn-primary" style="margin-top:10px;">Print / Save Prescription</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// WebRTC Application Infrastructure State
let localStream = null;
let currentCall = null;
let dataChannelConnection = null; 
let peer = null;

/**
 * 1. Sequential Hardware Camera and Microphone Pre-warming
 */
async function initLocalMedia() {
  if (localStream) return localStream;

  try {
    console.log("Requesting systems hardware permission tokens...");
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        width: { ideal: 1280 },
        height: { ideal: 720 },
        facingMode: "user"
      },
      audio: true
    });
    
    localStream = stream;
    const localVideo = document.getElementById('localVideo');
    if (localVideo) {
      localVideo.srcObject = stream;
    }
    console.log("Hardware resources secured and bound locally.");
    return stream;
  } catch (err) {
    console.error("Fatal hardware exceptions generated:", err);
    alert("Camera/Microphone access rejected. Check hardware privacy configurations.");
    throw err;
  }
}

/**
 * 2. Cross-Network Connection Engine Realignment
 */
function initializePeerEngine(chosenPeerId) {
  if (!chosenPeerId || chosenPeerId.trim() === "") {
    alert("Please assign a valid Identification String.");
    return;
  }

  // FIXED: Explicit public STUN integration enables NAT traversal across cellular/WAN lines
  peer = new Peer(chosenPeerId, {
    config: {
      'iceServers': [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun3.l.google.com:19302' }
      ]
    },
    debug: 1
  });

  peer.on('open', (id) => {
    console.log(`Registered to Signaling Network under token: ${id}`);
    document.getElementById('joinBtn').innerText = "Engine Live";
    document.getElementById('joinBtn').style.background = "var(--meet-green-dark)";
  });

  // FIXED: Synchronous confirmation pattern intercepts call intents safely
  peer.on('call', async (incomingCall) => {
    console.log(`Incoming connection stream requested from: ${incomingCall.peer}`);
    try {
      // Force pipeline resolution before acknowledging answer channel
      const stream = await initLocalMedia();
      incomingCall.answer(stream);
      bindCallLifecycleEvents(incomingCall);
      toggleSessionUI(true);
    } catch (e) {
      console.error("Answering attempt terminated due to pipeline issues:", e);
    }
  });

  // Structural processing for accompanying text messaging pipelines
  peer.on('connection', (conn) => {
    dataChannelConnection = conn;
    setupDataChannelLifecycle();
  });

  peer.on('error', (err) => {
    console.error("Signaling core layer fault:", err.type, err);
    if (err.type === 'peer-unavailable') {
      alert("Remote doctor or clinic node not active online.");
    }
  });
}

/**
 * 3. Media Pipeline Architecture Mapping
 */
function bindCallLifecycleEvents(call) {
  currentCall = call;

  call.on('stream', (remoteStream) => {
    console.log("Remote multiplexed stream caught. Rendering target viewport...");
    const remoteVideo = document.getElementById('remoteVideo');
    if (remoteVideo) {
      remoteVideo.srcObject = remoteStream;
      
      // Forces mobile browsers and Android wrapper containers to start canvas painting
      remoteVideo.play().catch(e => console.warn("Canvas context execution delayed:", e));
    }
  });

  call.on('close', () => {
    console.log("Media session stream closed by remote entity.");
    cleanUpCallSession();
  });

  call.on('error', (err) => {
    console.error("Media session exception caught:", err);
    cleanUpCallSession();
  });
}

/**
 * 4. Connect Call Pipeline (Triggered from Dialer Side)
 */
async function connectToRemoteDoctor(targetPeerId) {
  if (!targetPeerId || targetPeerId.trim() === "") {
    alert("Target routing target cannot be empty.");
    return;
  }

  try {
    // FIXED: Guarantees that local streams are functional before generating invitation signals
    const stream = await initLocalMedia();
    
    console.log(`Dialing connection channels toward: ${targetPeerId}`);
    const outboundCall = peer.call(targetPeerId, stream);
    bindCallLifecycleEvents(outboundCall);

    // Initialize parallel message data pipelines
    const conn = peer.connect(targetPeerId);
    dataChannelConnection = conn;
    setupDataChannelLifecycle();

    toggleSessionUI(true);
  } catch (error) {
    console.error("Connection initiation sequence faulted:", error);
  }
}

/**
 * 5. Messaging Channel Lifecycle Monitoring
 */
function setupDataChannelLifecycle() {
  dataChannelConnection.on('open', () => {
    console.log("Asynchronous message rail established.");
  });

  dataChannelConnection.on('data', (data) => {
    if(data.type === 'text') {
      renderChatMessage(data.payload, 'remote');
    }
  });
}

function sendTextMessage() {
  const input = document.getElementById('chatInput');
  const msgText = input.value.trim();
  if (!msgText || !dataChannelConnection) return;

  dataChannelConnection.send({ type: 'text', payload: msgText });
  renderChatMessage(msgText, 'local');
  input.value = '';
}

function renderChatMessage(text, owner) {
  const container = document.getElementById('messagesContainer');
  const card = document.createElement('div');
  card.className = `chat-msg ${owner}`;
  card.innerText = text;
  container.appendChild(card);
  container.scrollTop = container.scrollHeight;
}

/**
 * 6. UI Workspace Navigation and Resource Cleanup Utilities
 */
function switchTab(tabId) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
  
  if(tabId === 'chatTab') document.querySelectorAll('.tab-btn')[0].classList.add('active');
  if(tabId === 'rxTab') document.querySelectorAll('.tab-btn')[1].classList.add('active');
  
  document.getElementById(tabId).classList.add('active');
}

function addMedRow() {
  const container = document.getElementById('medsList');
  const row = document.createElement('div');
  row.className = 'med-row';
  row.innerHTML = `
    <input type="text" class="med-name" placeholder="Medication Name" style="flex:2;" />
    <input type="text" class="med-freq" placeholder="Dosage Patterns" style="flex:1;" />
  `;
  container.appendChild(row);
}

function getRxData() {
  const patient = document.getElementById('rxPatient').value || 'Unspecified Patient';
  const notes = document.getElementById('rxNotes').value;
  const meds = [];
  
  document.querySelectorAll('.med-row').forEach(row => {
    const name = row.querySelector('.med-name').value;
    const freq = row.querySelector('.med-freq').value;
    if(name.trim() !== "") {
      meds.push({ name, freq });
    }
  });

  return {
    patient,
    notes,
    meds,
    dateStr: new Date().toLocaleDateString()
  };
}

function printPrescriptionData(data) {
  const win = window.open('', '_blank');
  let medsLines = '';
  data.meds.forEach((m) => {
    medsLines += `<li><strong>${m.name}</strong> - <small>${m.freq}</small></li>`;
  });
  
  win.document.write(`
    <html>
    <head><title>Prescription - ${data.patient}</title></head>
    <body style="font-family:sans-serif; padding:40px; color:#1e293b; line-height: 1.6;">
      <h2 style="color:#34A853; border-bottom:2px solid #34A853; padding-bottom:10px;">℞ Telemedicine Sync - Prescription Document</h2>
      <p><strong>Date:</strong> ${data.dateStr}</p>
      <p><strong>Patient Name:</strong> ${data.patient}</p>
      <hr style="border:0; border-top:1px solid #e2e8f0; margin:20px 0;">
      <h3>Prescribed Regimen:</h3>
      <ul>${medsLines || '<li>No medications documented.</li>'}</ul>
      ${data.notes ? '<hr style="border:0; border-top:1px solid #e2e8f0; margin:20px 0;"><h3>Notes / Directions:</h3><p>' + data.notes + '</p>' : ''}
      <br><br>
      <p style="font-size:0.8rem; color:#64748b; margin-top:50px; border-top:1px dashed #e2e8f0; padding-top:10px;">Electronically authorized via Telemedicine Sync Node.</p>
      <script>window.print();<\/script>
    </body>
    </html>
  `);
  win.document.close();
}

function toggleSessionUI(inCall) {
  document.getElementById('disconnectBtn').style.display = inCall ? 'inline-block' : 'none';
  document.getElementById('connectBtn').style.display = inCall ? 'none' : 'inline-block';
}

function cleanUpCallSession() {
  const remoteVideo = document.getElementById('remoteVideo');
  if (remoteVideo) remoteVideo.srcObject = null;
  if (currentCall) {
    currentCall.close();
    currentCall = null;
  }
  toggleSessionUI(false);
  console.log("Media session layout reset complete.");
}

// Interactive Binding Declarations
document.getElementById('joinBtn').addEventListener('click', () => {
  const myId = document.getElementById('myIdInput').value;
  initializePeerEngine(myId);
  initLocalMedia(); 
});

document.getElementById('connectBtn').addEventListener('click', () => {
  const targetId = document.getElementById('targetIdInput').value;
  connectToRemoteDoctor(targetId);
});

document.getElementById('disconnectBtn').addEventListener('click', () => {
  cleanUpCallSession();
});

document.getElementById('sendChatBtn').addEventListener('click', sendTextMessage);
document.getElementById('chatInput').addEventListener('keypress', (e) => {
  if(e.key === 'Enter') sendTextMessage();
});

document.getElementById('directPrintRxBtn').addEventListener('click', () => {
  const data = getRxData();
  printPrescriptionData(data);
});
</script>
</body>
</html>
